[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jlcpcb_bom_tool"
version = "1.0.0"
description = "JLCPCB BOM Enrichment Tool"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "PyQt6",
    "pandas",
    "openpyxl"
]

[tool.setuptools]
packages = ["core", "ui", "models", "services", "resources", "saves"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "off"
reportMissingImports = false
reportMissingTypeStubs = false

[tool.pyrefly]
typeCheckingMode = "off"
reportMissingImports = false
