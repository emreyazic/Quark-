[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jlcpcb_bom_tool"
version = "1.0.0"
description = "JLCPCB BOM Enrichment Tool"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "PyQt6",
    "openpyxl"
]

[project.optional-dependencies]
dev = ["pytest", "pyright"]

[tool.setuptools]
packages = ["core", "ui", "models", "services", "resources", "saves"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = [
    "core",
    "models",
    "services",
]
reportMissingImports = false
reportMissingTypeStubs = false
